<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  body {
    width: 300px;
    margin: 0;
    padding: 18px;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: #e2e8f0;
  }

  /* ===== HEADER ===== */
  .header {
    text-align: center;
    margin-bottom: 16px;
  }

  .logo img {
    width: 48px;
    height: 48px;
  }

  .title {
    font-size: 16px;
    font-weight: 600;
    color: #1e293b;
  }

  .subtitle {
    font-size: 11px;
    color: #64748b;
  }

  /* ===== STATUS BOX ===== */
  .status-box {
    padding: 16px;
    border-radius: 20px;
    margin: 15px 0;
    text-align: center;
    background: white;
    border: 2px solid #e2e8f0;
    transition: all 0.3s ease;
  }

  /* SAFE */
  .safe {
    border-color: #10b981;
    background: linear-gradient(135deg, #f0fdf4, #dcfce7);
  }

  .safe .status-text {
    color: #059669;
  }

  /* PHISHING */
  .phishing {
    border-color: #ef4444;
    background: linear-gradient(135deg, #fef2f2, #fee2e2);
  }

  .phishing .status-text {
    color: #dc2626;
  }

  /* SUSPICIOUS */
  .warning {
    border-color: #facc15;
    background: linear-gradient(135deg, #fff7ed, #fef3c7);
  }

  .warning .status-text {
    color: #92400e;
  }

  .status-icon {
    font-size: 36px;
    margin-bottom: 6px;
  }

  .status-text {
    font-size: 18px;
    font-weight: 700;
  }

  .confidence {
    font-size: 13px;
    color: #64748b;
    margin-top: 4px;
  }

  /* URL */
  .url {
    background: white;
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
    color: #475569;
    border: 1px solid #e2e8f0;
    word-break: break-all;
    margin: 10px 0;
  }

  /* BUTTON */
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 16px;
    background: #3b82f6;
    color: white;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }

  .btn:hover {
    background: #2563eb;
  }
</style>
</head>

<body>

<div class="header">
  <div class="logo">
    <img src="icons/icon48.png">
  </div>
  <div class="title">SafeScan</div>
  <div class="subtitle">Real-Time Detector Prototype</div>
</div>

<div id="status" class="status-box">
  <div class="status-icon">⏳</div>
  <div class="status-text">Checking...</div>
</div>

<div id="url" class="url">Loading URL...</div>

<button id="checkBtn" class="btn">
  🔄 Check Current Page
</button>

<script src="popup.js"></script>
</body>
</html>
